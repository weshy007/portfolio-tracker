[project]
name = "portfolio-tracker"
version = "0.1.0"
description = "Personal portfolio, investment allocation, and budget tracker"
readme = "README.md"
authors = [
    { name = "Weshy Joe", email = "josephwaweru96@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=1.7.0",
]

[project.scripts]
portfolio-tracker = "main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
